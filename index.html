<style>
:root{--navy:#021e3a;--navy2:#0B2E52;--navy3:#16406B;--bg:#F3F2EE;--line:#E4E2DC;--line2:#ECEAE4;--muted:#5E636B;--muted2:#4F545B;--exp:#C2531A;--expT:#FBEADF;--inc:#2563C9;--incT:#E6EEFA;--lime:#C8F169;--amb:#8A5300;--ambT:#FCF1DC;--navyT:#E3E9F0;--green:#15803D;--greenT:#DCF3E3;--hmut:#A9BDD2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--navy);font-family:'Bricolage Grotesque','Noto Sans Lao',system-ui,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input::placeholder,textarea::placeholder{color:#7A7F87}
.app{max-width:480px;margin:0 auto;padding-bottom:104px}
.view{display:none;padding:calc(20px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 24px calc(18px + env(safe-area-inset-left));flex-direction:column;gap:14px}
.view.on{display:flex}
.row{display:flex;align-items:center;gap:10px}.sb{justify-content:space-between}.col{display:flex;flex-direction:column;gap:4px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.muted{color:var(--muted)}.sm{font-size:13px}.xs{font-size:12px}.b{font-weight:700}
.h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}.h2{margin:0;font-size:16px;font-weight:700}
.ib{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.ib.ghost{background:transparent;border:none;color:var(--hmut);margin:-10px -10px -10px 0}
.card{background:#fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.link{border:none;background:transparent;color:var(--inc);font-weight:600;font-size:13px;min-height:44px;padding:0;margin:-12px 0}
.hero{position:relative;overflow:hidden;background:var(--navy);color:#F3F2EE;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 26px 40px -20px rgba(2,30,58,.6);transition:transform .2s ease-out}
.hero .big{font-size:36px;font-weight:700;letter-spacing:-.03em;line-height:1}
.hero .unit{font-size:20px;color:var(--hmut);font-weight:500}
.hmut{color:var(--hmut)}
.tile{background:var(--navy2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px}
.tile b{font-size:17px}.incL{color:#A9C7FA}.expL{color:#F5B08A}
.act{height:52px;border-radius:16px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--navy)}
.act.dark{background:var(--navy);color:#fff;border-color:var(--navy)}.act.dark svg{color:var(--lime)}
.money{transition:filter .2s}body.hide .money{filter:blur(9px)}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:3px}
.lg{display:flex;align-items:center;gap:10px;font-size:14px}.dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.tx{display:flex;align-items:center;gap:12px;padding:12px 0;border:none;border-top:1px solid var(--line2);background:transparent;width:100%;text-align:left}
.tx:first-child{border-top:none}
.ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tx .nm{font-size:15px;font-weight:600}.tx .sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-size:15px;font-weight:700;text-align:right;white-space:nowrap}
.amt small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -18px;padding:2px 18px;scrollbar-width:none}
.chip{height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:6px;color:var(--navy)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .cnt{font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px;background:var(--bg);color:var(--muted)}
.chip.on .cnt{background:var(--lime);color:var(--navy)}
.field{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 14px;min-height:48px}
.field input,.field textarea{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:15px}
.dayh{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:0 4px}
.empty{text-align:center;padding:28px 16px;color:var(--muted);font-size:14px;line-height:1.7}
.seg{display:grid;gap:4px;background:#E7E5DF;border-radius:16px;padding:4px}
.seg button{height:44px;border:none;border-radius:12px;font-size:14px;font-weight:600;background:transparent;color:var(--muted2)}
.seg button.on{background:var(--navy);color:#F3F2EE}
nav.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;height:76px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start;padding:6px 8px env(safe-area-inset-bottom);z-index:20}
nav.nav button{border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;font-size:11px;color:var(--muted)}
nav.nav button.on{color:var(--navy);font-weight:700}
nav.nav .fab{justify-self:center;width:58px;height:58px;margin-top:-20px;border-radius:20px;background:var(--navy);color:var(--lime);box-shadow:0 8px 20px rgba(2,30,58,.3);transition:transform .3s}
nav.nav .fab:active{transform:perspective(500px) rotateX(16deg) scale(.95)}
.ov{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column}
.ov.on{display:flex}
.ov-body{flex:1;overflow-y:auto;width:100%;max-width:480px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 20px calc(18px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:12px}
.ov-foot{width:100%;max-width:480px;margin:0 auto;background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -6px 24px rgba(2,30,58,.08);padding:12px 18px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.keys button{height:46px;border:none;border-radius:14px;background:var(--bg);font-size:21px;font-weight:600;display:flex;align-items:center;justify-content:center;color:var(--navy)}
.btn{height:52px;border-radius:16px;border:none;background:var(--navy);color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn svg{color:var(--lime)}.btn:disabled{opacity:.45}
.btn.light{background:#fff;color:var(--navy);border:1px solid var(--line)}
.amtbig{font-size:42px;font-weight:700;letter-spacing:-.03em;line-height:1.1;text-align:center;display:block}
.amtbig span{font-size:22px;color:var(--muted);font-weight:600}
.curs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.curs button{height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--navy)}
.curs button i{font-style:normal;font-size:16px;color:var(--muted)}
.curs button.on{background:var(--navy);border-color:var(--navy);color:#fff}.curs button.on i{color:var(--lime)}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 6px}
.cat{display:flex;flex-direction:column;align-items:center;gap:5px;padding:0;border:none;background:transparent;min-height:78px}
.cat .ci{position:relative;width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;transition:transform .2s,box-shadow .2s}
.cat.on .ci{background:var(--navy)!important;color:var(--lime)!important;transform:translateY(-3px);box-shadow:0 10px 16px -8px rgba(2,30,58,.55)}
.cat .cl{font-size:11px;line-height:1.35;text-align:center;max-width:84px;color:var(--muted2)}
.cat.on .cl{color:var(--navy);font-weight:700}
.badge{position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;background:var(--lime);color:var(--navy);border:2px solid var(--bg);display:flex;align-items:center;justify-content:center}
.sheet-bg{position:fixed;inset:0;background:rgba(2,30,58,.45);z-index:60;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{width:100%;max-width:480px;background:#fff;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:sheetUp .3s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;max-width:90%;opacity:0;pointer-events:none;transition:all .25s;z-index:90;line-height:1.5}
#toast.on{opacity:1;transform:translateX(-50%)}
#loading{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.spin{width:44px;height:44px;border-radius:12px;background:var(--navy);animation:spinY 1.2s linear infinite}
@keyframes spinY{to{transform:perspective(300px) rotateY(360deg)}}
.bubble{background:#fff;border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:12px 14px;font-size:14px;line-height:1.7;white-space:pre-line}
.ubub{align-self:flex-end;background:var(--navy);color:#fff;border-radius:18px 18px 4px 18px;padding:10px 14px;font-size:14px;line-height:1.6;max-width:85%}
.tag{font-size:11px;font-weight:700;border-radius:8px;padding:3px 8px;display:inline-block}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.thumb{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .rm{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:none;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.scan{position:absolute;left:4px;right:4px;height:2px;border-radius:2px;background:var(--lime);box-shadow:0 0 10px 2px rgba(200,241,105,.75);animation:scan 2.2s ease-in-out infinite}
@keyframes scan{0%,100%{top:8%}50%{top:88%}}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line2);font-size:13px}.kv span:first-child{color:var(--muted);flex-shrink:0}.kv span:last-child{font-weight:600;text-align:right;word-break:break-word}
.warn{background:var(--ambT);color:#6B4100;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6}
.pg{display:grid;gap:6px}.pg div{height:6px;border-radius:99px;background:#DDDAD3}.pg div.on{background:var(--navy)}
@keyframes rise3d{from{opacity:0;transform:perspective(900px) rotateX(-22deg) translate3d(0,28px,-60px)}to{opacity:1;transform:none}}
@keyframes float3d{0%,100%{transform:perspective(1000px) rotateX(6deg) rotateY(-8deg)}50%{transform:perspective(1000px) rotateX(-4deg) rotateY(8deg) translateZ(14px)}}
@keyframes shine3d{0%{transform:translateX(-150%) skewX(-20deg)}55%,100%{transform:translateX(420%) skewX(-20deg)}}
@keyframes tile3d{from{opacity:0;transform:perspective(600px) rotateY(-60deg) scale(.85)}to{opacity:1;transform:none}}
@keyframes flip3d{from{opacity:0;transform:perspective(1000px) rotateY(-70deg) translateZ(-40px)}to{opacity:1;transform:none}}
@keyframes bump3d{from{opacity:.3;transform:perspective(400px) rotateX(-60deg)}to{opacity:1;transform:none}}
@keyframes donut3d{from{opacity:0;transform:perspective(800px) rotateX(70deg) rotate(-120deg) scale(.7)}to{opacity:1;transform:none}}
@keyframes bar3d{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.r3d{animation:rise3d .7s cubic-bezier(.2,.8,.2,1) both;transform-origin:50% 0}
.float3d{animation:float3d 8s ease-in-out infinite;transform-style:preserve-3d}
.shine{position:absolute;top:0;bottom:0;left:0;width:30%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.14),rgba(255,255,255,0));animation:shine3d 5s ease-in-out infinite;pointer-events:none}
.tileIn{animation:tile3d .45s cubic-bezier(.2,.8,.2,1) both}
.flipIn{animation:flip3d .55s cubic-bezier(.2,.8,.2,1) both;transform-origin:0 50%}
.bump{animation:bump3d .3s ease-out both}
.donut{animation:donut3d 1s cubic-bezier(.2,.8,.2,1) .15s both}
.bar{transform-origin:50% 100%;animation:bar3d .8s cubic-bezier(.2,.8,.2,1) .25s both}
.press{transition:transform .15s}.press:active{transform:perspective(500px) rotateX(12deg) translateY(2px) scale(.96)}
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}.d4{animation-delay:.2s}.d5{animation-delay:.25s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== Liquid Glass theme (iOS-style, adjustable) ===== */
:root{--ga:.42;--gblur:24px;
--gfill:rgba(255,255,255,var(--ga));--gfill2:rgba(255,255,255,calc(var(--ga) + .18));
--sheen:linear-gradient(155deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.12) 38%,rgba(255,255,255,0) 60%,rgba(255,255,255,.18) 100%);
--gf:blur(var(--gblur)) saturate(190%) brightness(1.04);
--ghi:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),inset 1px 0 0 rgba(255,255,255,.4),inset -1px 0 0 rgba(255,255,255,.25);
--gsh:0 12px 32px -14px rgba(20,40,80,.28),0 2px 6px -2px rgba(20,40,80,.08);
--acc:linear-gradient(170deg,rgba(222,250,150,.95),rgba(186,232,86,.86));--accfg:#0B2742;
--navy:#0B2742}
html{background:#E9EFF7}
body{background:transparent;min-height:100vh}
:root{--mesh:radial-gradient(28% 22% at 18% 12%,rgba(64,132,255,.55),transparent 70%),radial-gradient(26% 22% at 86% 16%,rgba(190,240,90,.75),transparent 70%),radial-gradient(30% 26% at 80% 62%,rgba(255,150,110,.45),transparent 70%),radial-gradient(30% 26% at 12% 70%,rgba(150,120,255,.38),transparent 70%),radial-gradient(26% 20% at 50% 96%,rgba(60,200,220,.40),transparent 70%)}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:var(--mesh);filter:blur(10px);animation:meshMove 26s ease-in-out infinite alternate}
@keyframes meshMove{0%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(-3%,2%,0) rotate(6deg)}100%{transform:translate3d(3%,-2%,0) rotate(-5deg)}}
.app{padding-bottom:120px}
.view>*,.ov-body>*{flex-shrink:0}
/* base glass surfaces */
.card,.field,.bubble,.act,.chip,.curs button,.ib:not(.ghost),.keys button,.thumb,.warn,.btn.light{background:var(--sheen),var(--gfill);-webkit-backdrop-filter:var(--gf);backdrop-filter:var(--gf);border:1px solid rgba(255,255,255,.55);box-shadow:var(--ghi),var(--gsh)}
.card{border-radius:28px}.field{border-radius:20px}.ib:not(.ghost){border-radius:50%}.thumb{border-radius:18px}
.chip,.curs button{border-radius:999px}.act,.btn{border-radius:999px}
.keys button{border-radius:20px;box-shadow:var(--ghi),0 4px 10px -6px rgba(20,40,80,.25)}
.chip .cnt{background:rgba(11,39,66,.08)}
/* selected = brighter, thicker glass */
.chip.on,.curs button.on{background:var(--sheen),rgba(255,255,255,calc(var(--ga) + .4));color:var(--navy);border:1px solid rgba(255,255,255,.95);box-shadow:var(--ghi),0 0 0 1.5px rgba(11,39,66,.55),0 10px 22px -10px rgba(20,40,80,.4)}
.curs button.on i{color:#5A8F00}
.chip.on .cnt{background:var(--acc);color:var(--accfg)}
.seg{background:rgba(255,255,255,calc(var(--ga) - .12));-webkit-backdrop-filter:var(--gf);backdrop-filter:var(--gf);border:1px solid rgba(255,255,255,.5);box-shadow:inset 0 1px 2px rgba(20,40,80,.12);border-radius:999px;padding:5px}
.seg button{border-radius:999px}
.seg button.on{background:var(--sheen),rgba(255,255,255,.92);color:var(--navy);font-weight:700;box-shadow:var(--ghi),0 6px 16px -6px rgba(20,40,80,.35)}
/* prominent (tinted) glass: lime */
.btn,.act.dark{background:var(--sheen),var(--acc);color:var(--accfg);border:1px solid rgba(255,255,255,.7);-webkit-backdrop-filter:var(--gf);backdrop-filter:var(--gf);box-shadow:var(--ghi),0 12px 26px -12px rgba(90,140,0,.55)}
.btn svg,.act.dark svg{color:var(--accfg)}
.cat .ci{box-shadow:var(--ghi),0 6px 14px -8px rgba(20,40,80,.3);border:1px solid rgba(255,255,255,.6)}
.cat.on .ci{background:var(--sheen),var(--acc)!important;color:var(--accfg)!important;box-shadow:var(--ghi),0 0 0 1.5px rgba(11,39,66,.5),0 12px 20px -8px rgba(90,140,0,.55)!important}
.badge{background:#fff;border-color:rgba(255,255,255,.9)}
.ico{box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.ico.accent{background:var(--sheen),var(--acc)!important;color:var(--accfg)!important;border:1px solid rgba(255,255,255,.7)}
/* hero: clear glass instead of solid navy */
.hero{background:var(--sheen),linear-gradient(135deg,rgba(255,255,255,calc(var(--ga) + .12)),rgba(255,255,255,calc(var(--ga) - .1)));color:var(--navy);-webkit-backdrop-filter:var(--gf);backdrop-filter:var(--gf);border:1px solid rgba(255,255,255,.7);border-radius:32px;box-shadow:var(--ghi),0 24px 50px -24px rgba(20,40,80,.45)}
.hero .unit,.hero .hmut,.hmut{color:var(--muted)}
.hero .ib.ghost{color:var(--muted)}
.tile{background:rgba(255,255,255,.32);border:1px solid rgba(255,255,255,.6);box-shadow:var(--ghi);border-radius:20px}
.incL{color:var(--inc)}.expL{color:var(--exp)}
.shine{background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0))}
.tx{border-top-color:rgba(11,39,66,.07)}
.warn{background:var(--sheen),rgba(255,236,200,calc(var(--ga) + .1));border-radius:20px}
/* floating capsule tab bar */
nav.nav{left:12px;right:12px;width:auto;max-width:456px;margin:0 auto;transform:none;bottom:calc(10px + env(safe-area-inset-bottom));height:68px;padding:6px;border-radius:34px;align-items:center;
background:var(--sheen),rgba(255,255,255,calc(var(--ga) + .14));-webkit-backdrop-filter:var(--gf);backdrop-filter:var(--gf);border:1px solid rgba(255,255,255,.65);box-shadow:var(--ghi),0 18px 40px -16px rgba(20,40,80,.38)}
nav.nav button{min-height:56px;border-radius:28px;transition:background .3s,transform .3s}
nav.nav button.on{background:rgba(255,255,255,.7);box-shadow:var(--ghi),0 4px 12px -6px rgba(20,40,80,.3)}
nav.nav button:active{transform:scale(1.08)}
nav.nav .fab{width:56px;height:56px;margin-top:0;border-radius:50%;background:var(--sheen),var(--acc);color:var(--accfg);border:1px solid rgba(255,255,255,.75);box-shadow:var(--ghi),0 10px 22px -8px rgba(90,140,0,.6)}
nav.nav .fab:active{transform:scale(1.12)}
/* overlays & sheets */
.ov{background:transparent}
.ov.on::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:var(--mesh),#E9EFF7;filter:blur(10px)}
.ov{isolation:isolate}

const Local = {
  _get() { let d = null; try { d = JSON.parse(localStorage.getItem('mt_demo') || 'null'); } catch (e) { } return d || { tx: [], settings: { rate_THB: 650, rate_USD: 21800, rate_CNY: 3000, owner_name: '' }, rules: [] }; },
  _put(d) { try { localStorage.setItem('mt_demo', JSON.stringify(d)); } catch (e) { } },
  _clean(t, d) {
    const r = t.currency === 'LAK' ? 1 : Number(d.settings['rate_' + t.currency]) || 1;
    return Object.assign({}, t, { id: 'L' + Date.now() + Math.random().toString(36).slice(2, 7), amount: String(t.amount), rate: String(r), amount_lak: String(Math.round(Number(t.amount) * r)), created_at: new Date().toISOString() });
  },
  getInit() { const d = this._get(); return Object.assign({}, d, { aiKey: false, demo: true, sheetUrl: '' }); },
  addTx(t) { const d = this._get(); const o = this._clean(t, d); d.tx.push(o); this._put(d); return o; },
  addTxBatch(list) {
    const d = this._get(); const refs = {}; d.tx.forEach((x) => { if (x.ref) refs[x.ref] = 1; });
    const saved = []; let skipped = 0;
    list.forEach((t) => { if (t.ref && refs[t.ref]) { skipped++; return; } const o = this._clean(t, d); if (o.ref) refs[o.ref] = 1; saved.push(o); d.tx.push(o); });
    this._put(d); return { saved, skipped };
  },
  deleteTx(id) { const d = this._get(); d.tx = d.tx.filter((x) => x.id !== id); this._put(d); return true; },
  updateTx(id, t) {
    const d = this._get(); const i = d.tx.findIndex((x) => x.id === id); if (i < 0) throw new Error('ບໍ່ພົບລາຍການ');
    const old = d.tx[i]; const r = t.currency === old.currency ? Number(old.rate) || 1 : (t.currency === 'LAK' ? 1 : Number(d.settings['rate_' + t.currency]) || 1);
    const o = Object.assign({}, old, t, { id, amount: String(t.amount), rate: String(r), amount_lak: String(Math.round(Number(t.amount) * r)), source: old.source, ref: old.ref, counterparty: old.counterparty, created_at: old.created_at });
    d.tx[i] = o; this._put(d); return o;
  },
  saveSettings(s) { const d = this._get(); Object.assign(d.settings, s); this._put(d); return d.settings; },

};

/* ===== Calculations ===== */
const monthTx = (m) => S.tx.filter((t) => String(t.date).slice(0, 7) === m);
function totals(list, key) {
  let inc = 0, exp = 0, pass = 0;
  list.forEach((t) => { const v = Number(t[key || 'amount_lak']) || 0; if (t.type === 'exp') exp += v; else if (t.category === 'pass') pass += v; else inc += v; });
  return { inc, exp, pass, net: inc - exp };
}
function byCat(list, key) {
  const m = {};
  list.filter((t) => t.type === 'exp').forEach((t) => { m[t.category] = m[t.category] || { id: t.category, name: catName(t.category), v: 0, n: 0 }; m[t.category].v += Number(t[key || 'amount_lak']) || 0; m[t.category].n++; });
  return Object.values(m).sort((a, b) => b.v - a.v);
}
function byCur(list) {
  const m = {};
  list.forEach((t) => { const c = t.currency || 'LAK'; m[c] = m[c] || { cur: c, exp: 0, inc: 0, expL: 0, incL: 0 }; if (t.type !== 'exp' && t.category === 'pass') return; const k = t.type === 'exp' ? 'exp' : 'inc'; m[c][k] += Number(t.amount) || 0; m[c][k + 'L'] += Number(t.amount_lak) || 0; });
  return Object.values(m);
}
const sortDesc = (a, b) => (b.date + b.time + b.created_at).localeCompare(a.date + a.time + a.created_at);
function favList() {
  const cnt = {};
  S.tx.filter((t) => t.type === 'exp').forEach((t) => { cnt[t.category] = (cnt[t.category] || 0) + 1; });
  const top = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]).filter((id) => EXP_IDS.indexOf(id) >= 0);
  const out = top.slice(0, 8);
  DEFAULT_FAV.forEach((id) => { if (out.length < 8 && out.indexOf(id) < 0) out.push(id); });
  return out;
}
function timeSuggest() {
  const h = new Date().getHours() + new Date().getMinutes() / 60;
  if (h >= 5 && h < 10) return ['coffee', 'breakfast'];
  if (h >= 10.5 && h < 14) return ['lunch', 'coffee'];
  if (h >= 17 && h < 21.5) return ['dinner', 'snack'];
  return ['snack', 'general'];
}

/* ===== Slip import — read on the phone itself (OCR), no server AI needed ===== */
const OCR_CFG = window.MT_OCR || {};
const OCR_SRC = OCR_CFG.script || 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
const OCR = { p: null, sched: null, workers: 0, growing: 0, state: 'idle' };
function ocrScript() {
  if (window.Tesseract) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = OCR_SRC; s.async = true;
    s.onload = () => res(); s.onerror = () => { s.remove(); rej(new Error('ໂຫຼດຕົວອ່ານສະລິບບໍ່ໄດ້ — ກວດອິນເຕີເນັດ')); };
    document.head.appendChild(s);
  });
}
function ocrWorker() {
  const o = { logger: () => { }, errorHandler: () => { } };
  ['workerPath', 'corePath', 'langPath'].forEach((k) => { if (OCR_CFG[k]) o[k] = OCR_CFG[k]; });
  const make = window.Tesseract.createWorker(OCR_CFG.langs || ['lao', 'eng'], 1, o);
  const slow = new Promise((_, rej) => setTimeout(() => rej(new Error('ຕົວອ່ານສະລິບໂຫຼດຊ້າເກີນໄປ')), 60000));
  return Promise.race([make, slow]);
}
function ocrGrow(n) {
  while (OCR.sched && OCR.workers + OCR.growing < n) {
    OCR.growing++;
    ocrWorker().then((w) => { OCR.sched.addWorker(w); OCR.workers++; }).catch(() => { }).then(() => { OCR.growing--; });
  }
}
/* resolves with a scheduler that has at least one worker; grows towards n workers in the background */
function ocrReady(n) {
  if (!OCR.p) {
    OCR.state = 'loading';
    OCR.p = ocrScript().then(() => ocrWorker()).then((w) => {
      OCR.sched = window.Tesseract.createScheduler(); OCR.sched.addWorker(w); OCR.workers = 1; OCR.state = 'ready';
      try { localStorage.setItem('mt_ocr', '1'); } catch (e) { }
      const el = document.getElementById('ocr-state'); if (el) el.innerHTML = ocrStateHtml();
      return OCR.sched;
    });
    OCR.p.catch(() => { OCR.p = null; OCR.state = 'failed'; const el = document.getElementById('ocr-state'); if (el) el.innerHTML = ocrStateHtml(); });
  }
  return OCR.p.then((sc) => { ocrGrow(n || 1); return sc; });
}
function ocrStateHtml() {
  if (OCR.state === 'ready') return svg('check', 14, 2.4) + ' ຕົວອ່ານໃນເຄື່ອງພ້ອມແລ້ວ · ບໍ່ໃຊ້ອິນເຕີເນັດໃນການອ່ານ';
  if (OCR.state === 'failed') return 'ໂຫຼດຕົວອ່ານໃນເຄື່ອງບໍ່ໄດ້' + (S.aiKey ? ' — ຈະໃຊ້ AI ອ່ານແທນ' : ' — ກວດອິນເຕີເນັດ ແລ້ວລອງໃໝ່');
  return 'ກຳລັງກຽມຕົວອ່ານໃນເຄື່ອງ… (ຄັ້ງທຳອິດດາວໂຫຼດປະມານ 9MB ເທື່ອດຽວ)';
}

function slipCanvas(file) {

    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const w0 = img.naturalWidth, h0 = img.naturalHeight;
      const cap = OCR_CFG.maxSide || 1700;

      if (w0 * s < 900 && !OCR_CFG.maxSide) s = Math.min(2.5, 900 / w0, 2400 / Math.max(w0, h0));
      const w = Math.max(1, Math.round(w0 * s)), h = Math.max(1, Math.round(h0 * s));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d', { willReadFrequently: true });
      x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);

      const px = new Uint8ClampedArray(src.data);   // untouched copy for colour sampling
      const d = src.data;

      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i + 1], b = d[i + 2];
        const mn = r < g ? (r < b ? r : b) : (g < b ? g : b);

        v = v >= 205 ? 255 : v * 1.244;

      res({ canvas: c, px, w, h });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('ເປີດຮູບບໍ່ໄດ້')); };

}
/* is the text inside this box printed in red or in green? */
function boxColor(cv, b) {

  for (let y = y0; y < y1; y++) {
    for (let x = x0; x < x1; x++) {
      const i = (y * cv.w + x) * 4, r = cv.px[i], g = cv.px[i + 1], bl = cv.px[i + 2];

      if (d < 55 || mx < 90) { if (mx < 110) dark++; continue; }
      let hh = mx === r ? ((g - bl) / d) % 6 : mx === g ? (bl - r) / d + 2 : (r - g) / d + 4;

  if (green > red * 2 && green > n * 0.04 && green > dark) return 'green';

}

/* ---------- text → fields ---------- */
const laoSk = (s) => String(s || '').replace(/ຳ/g, 'າ').replace(/[ັິ-ຼ່-ໍ\s]/g, '');
/* "1,285,000.00", "9.800.000,00", "20.00", "45,000" → number (the reader sometimes swaps , and .) */
function slipMoney(txt) {

  const m = raw.match(/^([+\-−]?)(\d{1,3})((?:[.,]\d{3})*)(?:[.,](\d{2}))?$/) || raw.match(/^([+\-−]?)(\d+)()[.,](\d{2})$/);
  if (!m || (!m[3] && m[4] == null)) return null;
  const val = parseFloat(m[2] + m[3].replace(/[.,]/g, '') + '.' + (m[4] || '0'));
  return val > 0 ? { val, sign: m[1] === '+' ? '+' : m[1] ? '-' : '' } : null;
}
const MON_EN = { JAN: 1, FEB: 2, MAR: 3, APR: 4, MAY: 5, JUN: 6, JUL: 7, AUG: 8, SEP: 9, OCT: 10, NOV: 11, DEC: 12 };
const p2 = (n) => String(n).padStart(2, '0');
function slipName(text) {
  const toks = String(text || '').replace(/[|©®°•·"“”‘’`~_=<>\[\]{}()]/g, ' ').replace(/\s+/g, ' ').trim().split(' ');
  while (toks.length && (toks[0].length <= 2 || !/[A-Za-z]/.test(toks[0]))) toks.shift();   // logo noise in front of the name
  while (toks.length && !/[A-Za-z]/.test(toks[toks.length - 1])) toks.pop();
  const t = toks.join(' ');
  if (!/^[A-Z][A-Z .'&*\-]{4,}$/.test(t)) return '';

}
/* "FT26314K9XQ2\MKX" → "FT26314K9XQ2"; '' when it does not look like a cleanly read reference */
function slipRef(tk) {
  const head = String(tk || '').replace(/^[\s:：)\]]+/, '').split(/[\\\/|\s]/)[0], c = head.replace(/[^A-Za-z0-9]/g, '').toUpperCase();

function slipDate(text) {

  if (m && +m[2] <= 12 && +m[1] <= 31) return m[3] + '-' + p2(m[2]) + '-' + p2(m[1]);

  ov.innerHTML = '<div class="ov-body">' +
    '<header class="row r3d" style="gap:12px"><button class="ib" data-act="closeset" aria-label="ກັບຄືນ">' + svg('left', 18, 2) + '</button><h1 class="h2" style="font-size:18px">ຕັ້ງຄ່າ</h1></header>' +
    '<section class="hero r3d d1"><div class="shine"></div><div class="row"><span class="ico accent" style="width:44px;height:44px">' + svg('sheet', 22) + '</span><div class="col" style="gap:2px"><b>Google Sheets</b><span class="hmut xs">' + (S.demo ? 'ໂໝດທົດລອງ — ຍັງບໍ່ເຊື່ອມ' : 'ເຊື່ອມຕໍ່ແລ້ວ · ' + S.tx.length + ' ລາຍການ') + '</span></div></div>' +
    (S.sheetUrl ? '<a class="act" style="text-decoration:none;height:44px" href="' + esc(S.sheetUrl) + '" target="_blank" rel="noopener">ເປີດ Google Sheet</a>' : '') +
    '<span class="hmut xs">AI (Gemini): ' + (S.aiKey ? 'ພ້ອມໃຊ້' : 'ຍັງບໍ່ໄດ້ຕັ້ງ GEMINI_API_KEY') + '</span></section>' +
    glassCard() +
    '<section class="card r3d d2"><h2 class="h2">ອັດຕາແລກປ່ຽນ (ເປັນກີບ)</h2>' +
    ['THB', 'USD', 'CNY'].map((c) => '<label class="field"><b style="width:64px">1 ' + CUR[c].sym + ' ' + CUR[c].name + '</b><input type="number" inputmode="decimal" id="rate-' + c + '" value="' + esc(st['rate_' + c]) + '" min="0" step="any" aria-label="ອັດຕາ ' + CUR[c].name + '"><span class="muted">₭</span></label>').join('') + '</section>' +
    '<section class="card r3d d3"><h2 class="h2">ຊື່ເຈົ້າຂອງບັນຊີ</h2><span class="muted xs" style="line-height:1.6">ຊ່ວຍໃຫ້ AI ຮູ້ວ່າສະລິບແມ່ນເງິນເຂົ້າ ຫຼື ເງິນອອກ (ພິມຕາມທີ່ຂຶ້ນໃນສະລິບ).</span><label class="field"><input id="owner" value="' + esc(st.owner_name || '') + '" placeholder="ເຊັ່ນ: SOMSAK PHOMMA" aria-label="ຊື່ເຈົ້າຂອງບັນຊີ"></label></section>' +
    '<section class="card r3d d4"><h2 class="h2">ກົດທີ່ AI ຈື່ໄວ້</h2>' + (S.rules.length ? S.rules.map((r) => '<div class="kv"><span>' + esc(r.match) + '</span><span>' + esc(catName(r.category)) + '</span></div>').join('') : '<span class="muted sm">ຍັງບໍ່ມີ</span>') + '</section>' +
    '</div><div class="ov-foot"><button class="btn press" data-act="saveset">' + svg('check', 18, 2.4) + 'ບັນທຶກການຕັ້ງຄ່າ</button></div>';
  ov.classList.add('on');
}
async function saveSet() {
  const obj = { rate_THB: Number($('#rate-THB').value) || 650, rate_USD: Number($('#rate-USD').value) || 21800, rate_CNY: Number($('#rate-CNY').value) || 3000, owner_name: $('#owner').value.trim() };
  try { S.settings = Object.assign(S.settings, await api('saveSettings', obj)); toast('ບັນທຶກການຕັ້ງຄ່າແລ້ວ'); closeOv('#ov-set'); render(); }
  catch (e) { toast('ບັນທຶກບໍ່ສຳເລັດ: ' + errMsg(e)); }
}

/* ===== Transaction sheet (view / edit / delete) ===== */
function openTx(id) {
  const t = S.tx.find((x) => x.id === id); if (!t) return;
  const tn = catTint(t.category);
  $('#sheet').innerHTML = '<div class="row"><span class="ico" style="background:' + tn[0] + ';color:' + tn[1] + '">' + svg(IC[t.category] ? t.category : 'other', 20) + '</span><div class="col" style="flex:1;gap:2px"><b>' + esc(catName(t.category)) + '</b><span class="muted xs">' + esc(t.date + ' ' + (t.time || '')) + '</span></div>' + amtHtml(t) + '</div>' +
    (t.note ? '<div class="kv"><span>ບັນທຶກ</span><span>' + esc(t.note) + '</span></div>' : '') + (t.counterparty ? '<div class="kv"><span>ຄູ່ທຸລະກຳ</span><span>' + esc(t.counterparty) + '</span></div>' : '') + (t.ref ? '<div class="kv"><span>ເລກອ້າງອີງ</span><span>' + esc(t.ref) + '</span></div>' : '') +
    '<button class="btn press" data-act="edittx" data-id="' + esc(t.id) + '">' + svg('pen', 18) + 'ແກ້ໄຂ (ຈຳນວນເງິນ, ໝວດ, ບັນທຶກ)</button>' +
    '<div class="g2"><button class="btn light" data-act="sheetclose">ປິດ</button><button class="btn light" style="color:var(--exp)" data-act="deltx" data-id="' + esc(t.id) + '">' + svg('trash', 18) + 'ລຶບ</button></div>';
  $('#sheet-bg').classList.add('on');
}
async function delTx(id, btn) {
  if (btn.dataset.confirm !== '1') { btn.dataset.confirm = '1'; btn.lastChild.textContent = 'ແຕະອີກຄັ້ງເພື່ອຢືນຢັນ'; return; }
  btn.disabled = true;
  try { await api('deleteTx', id); S.tx = S.tx.filter((x) => x.id !== id); $('#sheet-bg').classList.remove('on'); toast('ລຶບແລ້ວ'); render(); }
  catch (e) { toast('ລຶບບໍ່ສຳເລັດ: ' + errMsg(e)); btn.disabled = false; }
}

/* ===== Events ===== */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, v = el.dataset.v;
  if (a === 'go') { S.view = v; window.scrollTo(0, 0); render(); }
  else if (a === 'mprev' || a === 'mnext') { S.month = shiftMonth(S.month, a === 'mprev' ? -1 : 1); if (S.view === 'ai') S.ai = []; render(); }
  else if (a === 'hide') document.body.classList.toggle('hide');
  else if (a === 'add') openAdd();
  else if (a === 'closeadd') closeOv('#ov-add');
  else if (a === 'atype') { if (S.add.type !== v) { S.add.type = v; S.add.cat = v === 'inc' ? 'salary' : S.add.sug[0]; } updateAdd(true); }
  else if (a === 'acat') { S.add.cat = v; updateAdd(true); }
  else if (a === 'edittx') { $('#sheet-bg').classList.remove('on'); openAdd(el.dataset.id); }
  else if (a === 'rcur') { S.rcur = v; renderReport(); }
  else if (a === 'save') saveAdd();
  else if (a === 'slip') openSlip();
  else if (a === 'closeslip') closeOv('#ov-slip');
  else if (a.indexOf('sl') === 0 && el.dataset.i != null) slipAct(a, Number(el.dataset.i));
  else if (a === 'slipsave') slipSave();
  else if (a === 'settings') openSettings();
  else if (a === 'closeset') closeOv('#ov-set');
  else if (a === 'glass') { const g = GLASS_PRESETS[el.dataset.v]; if (g) { glassSet(g); const pct = Math.round((1 - g.a) * 100); const r = $('#gl-range'); if (r) r.value = pct; const v = $('#gl-val'); if (v) v.textContent = pct + '%'; document.querySelectorAll('[data-act="glass"]').forEach((b) => b.classList.toggle('on', b === el)); } }
  else if (a === 'saveset') saveSet();
  else if (a === 'filter') { S.filter = v; renderList(); }
  else if (a === 'tx') openTx(el.dataset.id);
  else if (a === 'sheetclose') $('#sheet-bg').classList.remove('on');
  else if (a === 'deltx') delTx(el.dataset.id, el);
  else if (a === 'aireport') askAI('');
  else if (a === 'aiask') askAI(el.dataset.q);
  else if (a === 'aisend') { const q = $('#ai-q').value.trim(); if (q) askAI(q); }
});
$('#sheet-bg').addEventListener('click', (e) => { if (e.target.id === 'sheet-bg') e.target.classList.remove('on'); });
$('#slip-file').addEventListener('change', (e) => { if (S.slip && e.target.files.length) slipFiles(e.target.files); e.target.value = ''; });
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'ai-q') { const q = e.target.value.trim(); if (q) askAI(q); } });

/* ===== Start ===== */

/* ===== Liquid Glass control (per-device) ===== */
const GLASS_PRESETS = { clear: { a: 0.2, b: 14 }, normal: { a: 0.42, b: 24 }, frost: { a: 0.68, b: 32 } };
function glassGet() { try { const g = JSON.parse(localStorage.getItem('mt_glass') || 'null'); if (g && typeof g.a === 'number') return g; } catch (e) {} return { a: 0.42, b: 24 }; }
function glassApply(g) { const r = document.documentElement.style; r.setProperty('--ga', String(g.a)); r.setProperty('--gblur', g.b + 'px'); }
function glassSet(g) { glassApply(g); try { localStorage.setItem('mt_glass', JSON.stringify(g)); } catch (e) {} }
glassApply(glassGet());
function glassCard() {
  const g = glassGet(); const pct = Math.round((1 - g.a) * 100);
  const mode = Object.keys(GLASS_PRESETS).find((k) => Math.abs(GLASS_PRESETS[k].a - g.a) < 0.01) || '';
  return '<section class="card r3d d2"><div class="row sb"><h2 class="h2">ຄວາມໂປ່ງແສງ (Liquid Glass)</h2><b id="gl-val" class="sm">' + pct + '%</b></div>' +
    '<div class="seg" style="grid-template-columns:repeat(3,1fr)">' +
    [['clear', 'ໃສ'], ['normal', 'ມາດຕະຖານ'], ['frost', 'ຂຸ່ນ']].map((m) => '<button class="' + (mode === m[0] ? 'on' : '') + '" data-act="glass" data-v="' + m[0] + '">' + m[1] + '</button>').join('') + '</div>' +
    '<input type="range" class="gl-range" id="gl-range" min="10" max="85" value="' + pct + '" aria-label="ລະດັບຄວາມໂປ່ງແສງ">' +
    '<span class="muted xs">ລາກໄປຂວາ = ໂປ່ງແສງຫຼາຍຂຶ້ນ. ບັນທຶກໄວ້ໃນເຄື່ອງນີ້ທັນທີ.</span></section>';
}
document.addEventListener('input', (e) => {
  if (e.target && e.target.id === 'gl-range') {
    const pct = Number(e.target.value); const a = Math.round((1 - pct / 100) * 100) / 100;
    glassSet({ a, b: Math.round(12 + a * 28) });
    const v = document.getElementById('gl-val'); if (v) v.textContent = pct + '%';
    document.querySelectorAll('[data-act="glass"]').forEach((b) => b.classList.remove('on'));
  }
});
(async function init() {
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
  if (API_ON && !getToken()) { showTokenScreen(''); return; }
  try {
    const d = await api('getInit');
    S.tx = d.tx || []; S.settings = Object.assign(S.settings, d.settings || {}); S.rules = d.rules || []; S.aiKey = !!d.aiKey; S.demo = !!d.demo; S.sheetUrl = d.sheetUrl || '';
  } catch (e) {
    if (e.auth) { showTokenScreen(errMsg(e)); return; }
    toast('ໂຫຼດຂໍ້ມູນບໍ່ສຳເລັດ: ' + errMsg(e));
  }
  $('#loading').style.display = 'none';
  try { if (localStorage.getItem('mt_ocr') === '1') setTimeout(() => { ocrReady(1).catch(() => { }); }, 2500); } catch (e) { }
  render();
})();
</script>
</body>
